
spring:
  application:
    name: atlasrh

  datasource:
    url: jdbc:postgresql://localhost:5432/atlasrh_db
    username: ${DB_USERNAME:atlasrh_user}
    password: ${DB_PASSWORD:123}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080
